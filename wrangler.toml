name = "personal-website-v2"
main = "worker.mjs"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "jurgenleka.com/*", zone_name = "jurgenleka.com" },
  { pattern = "www.jurgenleka.com/*", zone_name = "jurgenleka.com" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "personal-website-v2-cache"

[vars]
# Environment variables are set in Cloudflare dashboard

# Namespaces are specific to this portfolio. Counters are per Cloudflare location.
[[ratelimits]]
name = "CONTACT_REQUEST_LIMITER"
namespace_id = "2026100701"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONTACT_EMAIL_LIMITER"
namespace_id = "2026100702"
simple = { limit = 1, period = 60 }

[[ratelimits]]
name = "CONTACT_SITE_LIMITER"
namespace_id = "2026100703"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
